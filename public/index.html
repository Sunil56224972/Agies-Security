<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aegis - Incident Response Console</title>
  <meta name="description" content="Alert triage, evidence correlation and containment.">
  <meta name="theme-color" content="#15181d">
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <meta property="og:title" content="Aegis Security">
  <meta property="og:description" content="Alert triage, evidence correlation and containment.">
  <meta property="og:image" content="/img/aegis-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/views.css">
  <script src="/js/theme-boot.js"></script>
</head>
<body>
  <div class="gate" id="gate" hidden></div>
  <div class="shell" id="shell" hidden>
    <aside class="rail" id="rail" aria-label="Primary">
      <a class="brand" href="#/overview">
        <img class="brand__mark" src="/img/aegis-mark.png" alt="" width="30" height="30">
        <span class="brand__name">Aegis</span><span class="brand__env" id="brand-env">local</span>
      </a>

      <nav class="nav">
        <div class="nav__label">Response</div>
        <a class="nav__item" href="#/overview" data-route="overview"><i data-icon="grid"></i>Overview</a>
        <a class="nav__item" href="#/alerts" data-route="alerts"><i data-icon="bell"></i>Alerts<span class="nav__count" id="nav-open"></span></a>
        <a class="nav__item" href="#/investigate" data-route="investigate"><i data-icon="scan"></i>Investigate</a>
        <a class="nav__item" href="#/containment" data-route="containment"><i data-icon="shield"></i>Containment</a>
        <a class="nav__item" href="#/reports" data-route="reports"><i data-icon="chart"></i>Reports</a>
        <a class="nav__item" href="#/intel" data-route="intel"><i data-icon="globe"></i>Threat intel</a>
        <div class="nav__label">Reference</div>
        <a class="nav__item" href="#/assets" data-route="assets"><i data-icon="server"></i>Assets</a>
        <a class="nav__item" href="#/telemetry" data-route="telemetry"><i data-icon="terminal"></i>Telemetry</a>
        <a class="nav__item" href="#/settings" data-route="settings"><i data-icon="sliders"></i>Settings</a>
      </nav>

      <div class="rail__foot">
        <div class="sysline" id="sysline">
          <div class="sysline__row"><span class="live-dot live-dot--off" id="sys-dot"></span>Storage<b id="sys-store">...</b></div>
          <div class="sysline__row"><span class="live-dot live-dot--off" style="visibility:hidden"></span>Engine<b id="sys-engine">...</b></div>
        </div>
        <div class="analyst">
          <span class="avatar" id="analyst-initials">--</span>
          <div class="grow"><div class="analyst__name truncate" id="analyst-name">Signed out</div><div class="analyst__role" id="analyst-role"></div></div>
          <button class="icon-btn icon-btn--bare rail-btn" id="signout-btn" title="Sign out" aria-label="Sign out"><i data-icon="logout"></i></button>
        </div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar" id="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open navigation"><i data-icon="menu"></i></button>
        <div class="crumbs"><span>Aegis</span><span>/</span><b id="crumb">Overview</b></div>
        <div class="topbar__spacer"></div>
        <span class="clock" id="clock" title="UTC"></span>
        <button class="search-trigger" id="search-btn" aria-label="Search">
          <i data-icon="search"></i><span>Search</span><span class="kbd">/</span>
        </button>
        <button class="icon-btn theme-btn" id="theme-btn" aria-label="Toggle theme"><i class="sun" data-icon="sun"></i><i class="moon" data-icon="moon"></i></button>
      </header>
      <main class="view" id="view" tabindex="-1"></main>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
